[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "console-viewer"
version = "0.3.0"
description = "Show a games console on your PC through an HDMI capture card."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "sounddevice>=0.4.6",
    "cv2-enumerate-cameras>=1.1",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
console-viewer = "console_viewer.__main__:main"

[tool.setuptools]
packages = ["console_viewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
